name: Sync Documentation & Metadata

on:
  push:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to sync documentation and metadata from (defaults to the branch triggered on)'
        required: false
        default: ''

concurrency:
  group: sync-documentation
  cancel-in-progress: false

env:
  ACTIONS_FLAGS_RECORD_NODE_DEPRECATION: 'false'

jobs:
  sync:
    name: Sync to All Branches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync documentation across branches
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          SOURCE_BRANCH="${{ inputs.source_branch }}"
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="${GITHUB_REF_NAME}"
          fi
          echo "==> Source branch: $SOURCE_BRANCH"

          git fetch --all --prune
          git checkout "$SOURCE_BRANCH"

          TARGET_BRANCHES=()
          while IFS= read -r branch; do
            if [ -n "$branch" ] && [ "$branch" != "HEAD" ] && [ "$branch" != "$SOURCE_BRANCH" ]; then
              TARGET_BRANCHES+=("$branch")
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/)

          if [ ${#TARGET_BRANCHES[@]} -eq 0 ]; then
            echo "No other target branches found to sync with. Exiting."
            exit 0
          fi

          python3 - << 'EOF'
          import os
          import re
          import glob
          import shutil
          import subprocess

          # Read sync_items from config.yaml if present, otherwise fallback to defaults
          sync_items = []
          if os.path.exists("config.yaml"):
              with open("config.yaml", "r", encoding="utf-8") as cf:
                  lines = cf.readlines()
              in_sync_items = False
              for line in lines:
                  if re.match(r'^\s*sync_items:\s*', line):
                      in_sync_items = True
                      continue
                  if in_sync_items:
                      m = re.match(r'^\s*-\s+([^\s#]+)', line)
                      if m:
                          sync_items.append(m.group(1))
                      elif re.match(r'^[a-zA-Z0-9_]+:', line):
                          break

          if not sync_items:
              sync_items = [
                  "config.yaml", "update.json", "CHANGELOG.md", "README.md",
                  "SECURITY.md", "LICENSE*", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md",
                  "banner.png", "docs/", ".github/workflows/", ".github/ISSUE_TEMPLATE/"
              ]

          # On push events, check if commit touched any sync item; skip if not touched
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          before_sha = os.environ.get("BEFORE_SHA", "")
          after_sha = os.environ.get("AFTER_SHA", "")

          if event_name == "push" and before_sha and after_sha and before_sha != "0000000000000000000000000000000000000000":
              diff_out = subprocess.run(["git", "diff", "--name-only", before_sha, after_sha], capture_output=True, text=True)
              changed_files = diff_out.stdout.strip().splitlines() if diff_out.stdout else []

              def item_matches(f, item):
                  if item.endswith("/"):
                      return f.startswith(item) or f.startswith(item.rstrip("/") + "/")
                  if "*" in item:
                      import fnmatch
                      return fnmatch.fnmatch(f, item)
                  return f == item

              has_relevant_change = any(any(item_matches(cf, item) for item in sync_items) for cf in changed_files)
              if not has_relevant_change:
                  print("No configured sync items modified in this commit. Skipping sync.")
                  exit(0)

          temp_dir = os.environ.get("TEMP_DIR", "/tmp/sync_stage")
          if os.path.exists(temp_dir):
              shutil.rmtree(temp_dir)
          os.makedirs(temp_dir, exist_ok=True)

          # Stage sync items from source branch
          for item in sync_items:
              if item.endswith("/"):
                  src_dir = item.rstrip("/")
                  if os.path.isdir(src_dir):
                      dest_dir = os.path.join(temp_dir, src_dir)
                      shutil.copytree(src_dir, dest_dir, dirs_exist_ok=True)
                      print(f"Staged directory: {item}")
              elif "*" in item:
                  for matched in glob.glob(item):
                      dest_file = os.path.join(temp_dir, matched)
                      os.makedirs(os.path.dirname(dest_file) or ".", exist_ok=True)
                      shutil.copy2(matched, dest_file)
                      print(f"Staged matched file: {matched}")
              else:
                  if os.path.isfile(item):
                      dest_file = os.path.join(temp_dir, item)
                      os.makedirs(os.path.dirname(dest_file) or ".", exist_ok=True)
                      shutil.copy2(item, dest_file)
                      print(f"Staged file: {item}")
          EOF

          TEMP_DIR="/tmp/sync_stage"
          if [ ! -d "$TEMP_DIR" ] || [ -z "$(ls -A "$TEMP_DIR" 2>/dev/null)" ]; then
            echo "No files staged. Exiting."
            exit 0
          fi

          echo "==> Found ${#TARGET_BRANCHES[@]} target branches to evaluate:"
          for b in "${TARGET_BRANCHES[@]}"; do
            echo "  - $b"
          done

          SYNCED_COUNT=0
          SKIPPED_COUNT=0
          FAILED_COUNT=0

          for target in "${TARGET_BRANCHES[@]}"; do
            echo ""
            echo "=================================================="
            echo "Evaluating branch: $target"
            echo "=================================================="

            git reset --hard
            git clean -fd

            if ! git checkout -B "$target" "origin/$target"; then
              echo "ERROR: Could not checkout origin/$target"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            # Clean potential legacy lowercase collisions
            for legacy in "changelog.md" "readme.md" "license.txt" "security.md" "contributing.md"; do
              if [ -f "$legacy" ]; then
                git rm -f --ignore-unmatch "$legacy" 2>/dev/null || rm -f "$legacy"
              fi
            done

            rsync -av --delete "$TEMP_DIR/" ./
            git add -A

            if git diff --staged --quiet; then
              echo "Branch $target is already up-to-date. Skipped."
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
            else
              echo "Changes detected on $target! Committing and pushing..."
              git commit -m "Sync documentation and metadata from $SOURCE_BRANCH [skip ci]"
              if git push origin "$target"; then
                echo "Successfully pushed to origin/$target"
                SYNCED_COUNT=$((SYNCED_COUNT + 1))
              else
                echo "Push failed, trying pull --rebase..."
                if git pull --rebase origin "$target" && git push origin "$target"; then
                  echo "Successfully pushed to origin/$target after rebase"
                  SYNCED_COUNT=$((SYNCED_COUNT + 1))
                else
                  echo "ERROR: Failed to push to origin/$target"
                  FAILED_COUNT=$((FAILED_COUNT + 1))
                fi
              fi
            fi
          done

          echo ""
          echo "=================================================="
          echo "Sync Summary:"
          echo "  Synced:  $SYNCED_COUNT"
          echo "  Skipped: $SKIPPED_COUNT"
          echo "  Failed:  $FAILED_COUNT"
          echo "=================================================="

          git reset --hard
          git clean -fd
          git checkout "$SOURCE_BRANCH"
          rm -rf "$TEMP_DIR"

          if [ $FAILED_COUNT -gt 0 ]; then
            echo "Sync completed with $FAILED_COUNT error(s)."
            exit 1
          fi

          echo "Documentation and metadata successfully synchronized!"

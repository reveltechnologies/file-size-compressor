name: "CodeQL Analysis"

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.webp'
      - '**/*.pdf'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.webp'
      - '**/*.pdf'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ACTIONS_FLAGS_RECORD_NODE_DEPRECATION: 'false'

jobs:
  detect-languages:
    name: Detect Languages
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-languages: ${{ steps.set-matrix.outputs.has-languages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect CodeQL supported languages
        id: set-matrix
        shell: bash
        run: |
          langs=()

          if [ -d ".github/workflows" ] && [ "$(ls -A .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null)" ]; then
            langs+=('{"language": "actions", "build-mode": "none"}')
          fi

          if git ls-files | grep -Eq '\.(c|cc|cpp|cxx|h|hpp|hxx)$'; then
            langs+=('{"language": "c-cpp", "build-mode": "autobuild"}')
          fi

          if git ls-files | grep -Eq '\.(cs|csx)$'; then
            langs+=('{"language": "csharp", "build-mode": "autobuild"}')
          fi

          if git ls-files | grep -Eq '\.go$'; then
            langs+=('{"language": "go", "build-mode": "autobuild"}')
          fi

          if git ls-files | grep -Eq '\.(java|kt|kts)$'; then
            langs+=('{"language": "java-kotlin", "build-mode": "autobuild"}')
          fi

          if git ls-files | grep -Eq '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|html|htm|vue|svelte)$' || [ -f "package.json" ]; then
            langs+=('{"language": "javascript-typescript", "build-mode": "none"}')
          fi

          if git ls-files | grep -Eq '\.py$'; then
            langs+=('{"language": "python", "build-mode": "none"}')
          fi

          if git ls-files | grep -Eq '\.(rb|erb|rake)$' || [ -f "Gemfile" ]; then
            langs+=('{"language": "ruby", "build-mode": "none"}')
          fi

          if git ls-files | grep -Eq '\.swift$'; then
            langs+=('{"language": "swift", "build-mode": "autobuild"}')
          fi

          if [ ${#langs[@]} -eq 0 ]; then
            langs+=('{"language": "actions", "build-mode": "none"}')
          fi

          matrix_json=$(printf ",%s" "${langs[@]}")
          matrix_json="{\"include\":[${matrix_json:1}]}"

          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "has-languages=true" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-languages
    if: needs.detect-languages.outputs.has-languages == 'true'
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-languages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
